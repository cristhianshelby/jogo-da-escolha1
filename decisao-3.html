<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decisão 3 - Castelo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #game-container { border-color: rgba(192, 57, 43, 0.3); }
        #story-box { border-left-color: #c0392b; }
        header h1 { color: #c0392b; }
        .pontuacao-topo {
            background: rgba(0,0,0,0.4);
            padding: 8px 15px;
            border-radius: 20px;
            display: inline-block;
            margin: 5px auto;
            color: #f1c40f;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .legenda {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 10px 0;
            font-size: 0.8rem;
        }
        .legenda .boa { color: #2ecc71; }
        .legenda .ruim { color: #e74c3c; }
        .legenda .neutra { color: #f39c12; }
    </style>
</head>
<body>
    <div id="game-container">
        <header>
            <h1>🏰 Castelo Real</h1>
            <div id="phase-indicator">📍 Decisão 3</div>
            <div class="pontuacao-topo">
                ⭐ Pontos: <span id="pontos-display">0</span>
            </div>
            <div id="status-bar">
                <span>❤️ Vida: <span id="health">100</span></span>
                <span>🛡️ Passos: <span id="steps">0</span></span>
                <span>🎒 Itens: <span id="inventory-display">Vazio</span></span>
            </div>
            <div class="legenda">
                <span class="boa">✅ Boa (+2 pts)</span>
                <span class="neutra">⚖️ Neutra (0 pts)</span>
                <span class="ruim">❌ Ruim (-2 pts)</span>
            </div>
        </header>
        <main>
            <div id="story-box">
                <p id="story-text">🏰 O rei te recebe. "Herói, você precisa se preparar para a batalha final!"</p>
            </div>
            <div id="choices-box">
                <button class="choice-btn danger" onclick="escolher('3a')">⚔️ Treinar com cavaleiros </button>
                <button class="choice-btn magic" onclick="escolher('3b')">📚 Estudar na biblioteca </button>
                <button class="choice-btn success" onclick="escolher('3c')">🍺 Descansar na taverna </button>
            </div>
            <div id="image-container">
                <img id="scene-image" src="https://i.imgur.com/S0n9LpQ.jpg" alt="Castelo">
            </div>
        </main>
        <footer>
            <button onclick="goToMenu()" class="secondary">🏠 Menu</button>
            <button onclick="window.location.href='decisao-2a.html'" class="secondary">⬅️ Voltar</button>
            <button onclick="resetGame()">🔄 Reiniciar</button>
        </footer>
    </div>
    <script src="script.js"></script>
    <script>
        updateUI();

        function escolher(opcao) {
            addDecision('3');
            if (opcao === '3a') {
                addItem('Armadura Reforçada');
                addForca(10);
                addPontoBom();
                window.location.href = 'decisao-3a.html';
            } else if (opcao === '3b') {
                addItem('Livro de Feitiços');
                addMagia(10);
                addPontoNeutro();
                window.location.href = 'decisao-3b.html';
            } else {
                modifyHealth(15);
                addItem('Poção de Cura');
                addPontoRuim();
                window.location.href = 'decisao-3c.html';
            }
        }
    </script>
</body>
</html>
