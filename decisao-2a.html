<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decisão 2A</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .pontuacao-topo {
            background: rgba(0,0,0,0.4);
            padding: 8px 15px;
            border-radius: 20px;
            display: inline-block;
            margin: 5px auto;
            color: #f1c40f;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .legenda {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 10px 0;
            font-size: 0.8rem;
        }
        .legenda .boa { color: #2ecc71; }
        .legenda .ruim { color: #e74c3c; }
        .legenda .neutra { color: #f39c12; }
    </style>
</head>
<body>
    <div id="game-container">
        <header>
            <h1>⚡ Resultado</h1>
            <div id="phase-indicator">📍 Decisão 2A</div>
            <div class="pontuacao-topo">
                ⭐ Pontos: <span id="pontos-display">0</span>
            </div>
            <div id="status-bar">
                <span>❤️ Vida: <span id="health">100</span></span>
                <span>🛡️ Passos: <span id="steps">0</span></span>
                <span>🎒 Itens: <span id="inventory-display">Vazio</span></span>
            </div>
            <div class="legenda">
                <span class="boa">✅ Boa (+2 pts)</span>
                <span class="neutra">⚖️ Neutra (0 pts)</span>
                <span class="ruim">❌ Ruim (-2 pts)</span>
            </div>
        </header>
        <main>
            <div id="story-box">
                <p id="story-text">⚡ Você sobreviveu! O que fazer agora?</p>
            </div>
            <div id="choices-box">
                <button class="choice-btn danger" onclick="irPara('3')">🏰 Castelo </button>
                <button class="choice-btn success" onclick="irPara('4')">🏕️ Descansar </button>
                <button class="choice-btn magic" onclick="irPara('5')">🔮 Explorar </button>
            </div>
            <div id="image-container">
                <img id="scene-image" src="https://i.imgur.com/S0n9LpQ.jpg" alt="Continuação">
            </div>
        </main>
        <footer>
            <button onclick="goToMenu()" class="secondary">🏠 Menu</button>
            <button onclick="resetGame()">🔄 Reiniciar</button>
        </footer>
    </div>
    <script src="script.js"></script>
    <script>
        updateUI();

        function irPara(opcao) {
            addDecision('2a');
            if (opcao === '3') {
                addPontoBom();
                window.location.href = 'decisao-3.html';
            } else if (opcao === '4') {
                modifyHealth(20);
                addPontoNeutro();
                window.location.href = 'decisao-4.html';
            } else {
                addItem('Pergaminho');
                addPontoRuim();
                window.location.href = 'decisao-5.html';
            }
        }
    </script>
</body>
</html>
