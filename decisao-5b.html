<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💀 Derrota</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #game-container { border-color: rgba(231, 76, 60, 0.5); }
        #story-box { border-left-color: #e74c3c; border-width: 6px; }
        header h1 { 
            color: #e74c3c; 
            text-shadow: 0 0 40px rgba(231,76,60,0.5);
            font-size: 2.5rem;
        }
        #story-text { 
            text-align: center; 
            font-size: 1.3rem; 
            line-height: 2;
        }
        .resultado-box {
            background: rgba(0,0,0,0.4);
            padding: 20px;
            border-radius: 12px;
            margin: 15px 0;
        }
        .resultado-box .grande {
            font-size: 2rem;
            font-weight: bold;
            color: #e74c3c;
        }
        .detalhes {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 10px 0;
        }
        .detalhes-item {
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }
        .detalhes-item .num { font-size: 1.5rem; font-weight: bold; color: #e74c3c; }
        .atributos-final {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 10px 0;
            flex-wrap: wrap;
        }
        .atributo-final {
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
        }
        .atributo-final.forca { background: rgba(231, 76, 60, 0.3); color: #e74c3c; }
        .atributo-final.magia { background: rgba(155, 89, 182, 0.3); color: #9b59b6; }
        .atributo-final.diplomacia { background: rgba(46, 204, 113, 0.3); color: #2ecc71; }
        .btn-tentar {
            background: linear-gradient(135deg, #f39c12, #e67e22) !important;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <header>
            <h1>💀 DERROTA</h1>
            <div id="phase-indicator">📍 O Dragão foi mais forte...</div>
            <div id="status-bar">
                <span>❤️ Vida: <span id="health">100</span></span>
                <span>🛡️ Passos: <span id="steps">0</span></span>
                <span>🎒 Itens: <span id="inventory-display">Vazio</span></span>
            </div>
        </header>
        <main>
            <div id="story-box">
                <p id="story-text">🐉 O DRAGÃO ERA FORTE DEMAIS! 🐉</p>
                <div class="resultado-box">
                    <div class="grande">💔 VOCÊ FOI DERROTADO...</div>
                    <div class="detalhes" id="detalhesBatalha">
                        <div class="detalhes-item">
                            ⚔️ Seu Poder<br>
                            <span class="num" id="poderHeroiFinal">0</span>
                        </div>
                        <div class="detalhes-item">
                            🐉 Poder do Dragão<br>
                            <span class="num" id="poderDragaoFinal">0</span>
                        </div>
                    </div>
                    <div class="atributos-final" id="atributosFinal">
                        <span class="atributo-final forca">⚔️ Força: <span id="forcaFinal">0</span></span>
                        <span class="atributo-final magia">🔮 Magia: <span id="magiaFinal">0</span></span>
                        <span class="atributo-final diplomacia">🤝 Diplomacia: <span id="diplomaciaFinal">0</span></span>
                    </div>
                    <p style="color: #dfe6e9; margin-top: 10px;">
                        💪 Mas você ainda está vivo! Use o que aprendeu e tente novamente!
                    </p>
                </div>
            </div>
            <div id="choices-box">
                <button class="choice-btn btn-tentar" onclick="window.location.href='decisao-4a.html'">⚔️ Tentar Novamente</button>
                <button class="choice-btn secondary" onclick="window.location.href='decisao-3.html'">🏰 Voltar ao Castelo</button>
                <button class="choice-btn secondary" onclick="window.location.href='index.html'">🏠 Menu</button>
            </div>
            <div id="image-container">
                <img id="scene-image" src="https://i.imgur.com/2u9nYHb.jpg" alt="Derrota">
            </div>
        </main>
        <footer>
            <button onclick="goToMenu()" class="secondary">🏠 Menu</button>
            <button onclick="resetGame()">🔄 Reiniciar</button>
        </footer>
    </div>
    <script src="script.js"></script>
    <script>
        addDecision('5b');
        updateUI();
        const s = getState();
        
        document.getElementById('health').textContent = s.health;
        document.getElementById('steps').textContent = s.steps;
        document.getElementById('inventory-display').textContent = s.inventory.length > 0 ? s.inventory.join(' | ') : 'Vazio';
        
        document.getElementById('poderHeroiFinal').textContent = s.poderHeroi || '?';
        document.getElementById('poderDragaoFinal').textContent = s.poderDragao || '?';
        document.getElementById('forcaFinal').textContent = s.forca || 0;
        document.getElementById('magiaFinal').textContent = s.magia || 0;
        document.getElementById('diplomaciaFinal').textContent = s.diplomacia || 0;
    </script>
</body>
</html>
