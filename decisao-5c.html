<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decisão 5C - Sobrevivente</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #game-container { border-color: rgba(52, 152, 219, 0.3); }
        #story-box { border-left-color: #3498db; }
        header h1 { color: #3498db; }
        .atributos-final {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 10px 0;
            flex-wrap: wrap;
        }
        .atributo-final {
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
        }
        .atributo-final.forca { background: rgba(231, 76, 60, 0.3); color: #e74c3c; }
        .atributo-final.magia { background: rgba(155, 89, 182, 0.3); color: #9b59b6; }
        .atributo-final.diplomacia { background: rgba(46, 204, 113, 0.3); color: #2ecc71; }
    </style>
</head>
<body>
    <div id="game-container">
        <header>
            <h1>🛡️ Sobrevivente</h1>
            <div id="phase-indicator">📍 Você escapou com vida!</div>
            <div id="status-bar">
                <span>❤️ Vida: <span id="health">100</span></span>
                <span>🛡️ Passos: <span id="steps">0</span></span>
                <span>🎒 Itens: <span id="inventory-display">Vazio</span></span>
            </div>
        </header>
        <main>
            <div id="story-box">
                <p id="story-text">🛡️ Você lutou bravamente, mas o dragão era muito poderoso.Você conseguiu escapar com vida, mas sabe que precisa ficar mais forte.A batalha não acabou!</p>
            </div>
            <div id="choices-box">
                <button class="choice-btn danger" onclick="window.location.href='decisao-4a.html'">⚔️ Tentar Novamente</button>
                <button class="choice-btn magic" onclick="window.location.href='decisao-3.html'">🏰 Voltar ao Castelo</button>
                <button class="choice-btn secondary" onclick="window.location.href='index.html'">🏠 Menu</button>
            </div>
            <div id="image-container">
                <img id="scene-image" src="https://i.imgur.com/S0n9LpQ.jpg" alt="Sobrevivente">
            </div>
        </main>
        <footer>
            <button onclick="goToMenu()" class="secondary">🏠 Menu</button>
            <button onclick="resetGame()">🔄 Reiniciar</button>
        </footer>
    </div>
    <script src="script.js"></script>
    <script>
        addDecision('5c');
        updateUI();
        const s = getState();
        document.getElementById('health').textContent = s.health;
        document.getElementById('steps').textContent = s.steps;
        document.getElementById('inventory-display').textContent = s.inventory.length > 0 ? s.inventory.join(' | ') : 'Vazio';
    </script>
</body>
</html>
