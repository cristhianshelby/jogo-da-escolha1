<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decisão 1 - Início</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #game-container { border-color: rgba(46, 204, 113, 0.3); }
        #story-box { border-left-color: #2ecc71; }
        header h1 { color: #2ecc71; }
        .pontuacao-topo {
            background: rgba(0,0,0,0.4);
            padding: 8px 15px;
            border-radius: 20px;
            display: inline-block;
            margin: 5px auto;
            color: #f1c40f;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .legenda {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 10px 0;
            font-size: 0.8rem;
        }
        .legenda .boa { color: #2ecc71; }
        .legenda .ruim { color: #e74c3c; }
        .legenda .neutra { color: #f39c12; }
    </style>
</head>
<body>
    <div id="game-container">
        <header>
            <h1>🌅 O Despertar</h1>
            <div id="phase-indicator">📍 Decisão 1</div>
            <div class="pontuacao-topo">
                ⭐ Pontos: <span id="pontos-display">0</span>
            </div>
            <div id="status-bar">
                <span>❤️ Vida: <span id="health">100</span></span>
                <span>🛡️ Passos: <span id="steps">0</span></span>
                <span>🎒 Itens: <span id="inventory-display">Vazio</span></span>
            </div>
            <div class="legenda">
                <span class="boa">✅ Boa (+2 pts)</span>
                <span class="neutra">⚖️ Neutra (0 pts)</span>
                <span class="ruim">❌ Ruim (-2 pts)</span>
            </div>
        </header>
        <main>
            <div id="story-box">
                <p id="story-text">🌅 Você acorda em uma clareira misteriosa. Três caminhos se abrem diante de você. Suas escolhas determinarão o destino do reino!</p>
            </div>
            <div id="choices-box">
                <button class="choice-btn success" onclick="escolher('1a')">
                    🌲 Floresta Sombria (Corajoso) 
                </button>
                <button class="choice-btn warning" onclick="escolher('1b')">
                    🏞️ Rio Cristalino (Equilibrado) 
                </button>
                <button class="choice-btn danger" onclick="escolher('1c')">
                    🏔️ Montanha Nevada (Arriscado) 
                </button>
            </div>
            <div id="image-container">
                <img id="scene-image" src="https://i.imgur.com/XqT4pUZ.jpg" alt="Clareira">
            </div>
        </main>
        <footer>
            <button onclick="goToMenu()" class="secondary">🏠 Menu</button>
            <button onclick="resetGame()">🔄 Reiniciar</button>
        </footer>
    </div>
    <script src="script.js"></script>
    <script>
        updateUI();

        function escolher(opcao) {
            addDecision('1');
            if (opcao === '1a') {
                addItem('Mapa da Floresta');
                addForca(5);
                addPontoBom(); // +2 pontos
                window.location.href = 'decisao-1a.html';
            } else if (opcao === '1b') {
                addItem('Garrafa de Água');
                addDiplomacia(5);
                addPontoNeutro(); // 0 pontos
                window.location.href = 'decisao-1b.html';
            } else {
                addItem('Capa Térmica');
                addMagia(5);
                addPontoRuim(); // -2 pontos
                window.location.href = 'decisao-1c.html';
            }
        }
    </script>
</body>
</html>
